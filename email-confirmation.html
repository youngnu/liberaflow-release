<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title>이메일 확인 - Liberaflow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #1d1d1f;
            background: #ffffff;
            min-height: 100vh;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .success-container {
            background: #f5f5f7;
            padding: 40px;
            border-radius: 12px;
            margin: 30px 0;
            border: 1px solid #e5e5e7;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 24px;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .success-message {
            font-size: 1.1rem;
            color: #656568;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 200px;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .btn-primary:hover {
            background: #0068d1;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e5e5e7;
        }

        .btn-secondary:hover {
            background: #e5e5e7;
        }

        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .status.noscript-status {
            display: block;
        }

        .status.success {
            background: #f0f5ff;
            color: #0068d1;
            border: 1px solid #d1e4ff;
        }

        .status.error {
            background: #fff5f5;
            color: #d70015;
            border: 1px solid #ffd1d1;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .success-icon,
            .loading {
                animation: none;
            }

            .btn {
                transition: none;
            }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #656568;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .success-container {
                padding: 32px 24px;
                margin: 20px 0;
            }

            .logo {
                font-size: 2rem;
            }

            .success-title {
                font-size: 1.75rem;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Liberaflow</h1>
        
        <div class="success-container">
            <div class="success-icon" id="confirmationIcon" aria-hidden="true">✉️</div>
            <h2 class="success-title" id="confirmationTitle">이메일 확인 결과</h2>
            <p class="success-message" id="confirmationMessage">
                이메일 확인 링크의 처리 결과를 확인하고 있습니다.
            </p>
            
            <div class="actions">
                <a class="btn btn-primary" href="docs.html#install" id="openAppBtn">
                    앱 실행·설치 안내
                </a>
                <button class="btn btn-secondary" id="closeWindowBtn">
                    창 닫기
                </button>
            </div>
            
            <div id="status" class="status" role="status" aria-live="polite"></div>
            <noscript><div class="status error noscript-status">확인 링크 결과를 표시하려면 JavaScript가 필요합니다.</div></noscript>
        </div>
        
        <div class="footer">
            결과를 확인한 뒤 이 창을 닫아주세요.
        </div>
    </div>

    <script src="assets/js/email-confirmation.js"></script>
</body>
</html>
