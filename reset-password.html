<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - Liberaflow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #1d1d1f;
            background: #ffffff;
            min-height: 100vh;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .reset-container {
            background: #f5f5f7;
            padding: 40px;
            border-radius: 12px;
            margin: 30px 0;
            border: 1px solid #e5e5e7;
        }

        .reset-icon {
            font-size: 4rem;
            margin-bottom: 24px;
            color: #0071e3;
        }

        .reset-title {
            font-size: 2rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .reset-message {
            font-size: 1.1rem;
            color: #86868b;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .actions {
            display: flex;
            gap: 16px;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 32px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 200px;
        }

        .btn-primary {
            background: #0071e3;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-primary:disabled {
            background: #d2d2d7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
            border: 1px solid #e5e5e7;
        }

        .btn-secondary:hover {
            background: #e5e5e7;
        }

        .status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .status.success {
            background: #f0f5ff;
            color: #0071e3;
            border: 1px solid #d1e4ff;
        }

        .status.error {
            background: #fff5f5;
            color: #d70015;
            border: 1px solid #ffd1d1;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0071e3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #86868b;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .reset-container {
                padding: 32px 24px;
                margin: 20px 0;
            }

            .logo {
                font-size: 2rem;
            }

            .reset-title {
                font-size: 1.75rem;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1 class="logo">Liberaflow</h1>
        
        <div class="reset-container">
            <div class="reset-icon">🔐</div>
            <h2 class="reset-title">비밀번호 재설정</h2>
            <p class="reset-message">
                새로운 비밀번호를 입력해주세요.
            </p>
            
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword" class="form-label">새 비밀번호</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        class="form-input" 
                        placeholder="새 비밀번호를 입력하세요"
                        minlength="8"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="form-input" 
                        placeholder="비밀번호를 다시 입력하세요"
                        minlength="8"
                        required
                    >
                </div>
                
                <div class="actions">
                    <button type="submit" class="btn btn-primary" id="resetBtn">
                        비밀번호 재설정
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeWindow()">
                        취소
                    </button>
                </div>
            </form>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="footer">
            비밀번호는 8자 이상이어야 합니다.
        </div>
    </div>

    <script>
        // Supabase 설정
        const supabaseUrl = 'https://ezfarkofsfjqgnsyignt.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZmFya29mc2ZqcWduc3lpZ250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjA4MzQyMTMsImV4cCI6MjAzNjQxMDIxM30.UJkG0DaRD6OHpzJKdZYLXhips3W9E83G8Vsc1_HCDps';
        
        // Supabase 클라이언트 초기화
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
        
        // URL 파라미터 확인
        const urlParams = new URLSearchParams(window.location.search);
        const access_token = urlParams.get('access_token');
        const refresh_token = urlParams.get('refresh_token');
        const code = urlParams.get('code');
        
        console.log('Password reset params:', { access_token, refresh_token, code });
        
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.className = `status ${isError ? 'error' : 'success'}`;
            status.textContent = message;
            status.style.display = 'block';
        }
        
        function showLoading() {
            const button = document.getElementById('resetBtn');
            button.innerHTML = `<div class="loading"></div>재설정 중...`;
            button.disabled = true;
        }
        
        function hideLoading() {
            const button = document.getElementById('resetBtn');
            button.innerHTML = '비밀번호 재설정';
            button.disabled = false;
        }
        
        function closeWindow() {
            try {
                window.close();
            } catch (error) {
                showStatus('이 창을 수동으로 닫아주세요.', true);
            }
        }
        
        // 비밀번호 재설정 폼 처리
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showStatus('비밀번호가 일치하지 않습니다.', true);
                return;
            }
            
            if (newPassword.length < 8) {
                showStatus('비밀번호는 8자 이상이어야 합니다.', true);
                return;
            }
            
            showLoading();
            
            try {
                // 세션 설정
                if (access_token && refresh_token) {
                    // 토큰이 있는 경우 직접 세션 설정
                    const { data: sessionData, error: sessionError } = await supabase.auth.setSession({
                        access_token: access_token,
                        refresh_token: refresh_token
                    });
                    
                    if (sessionError) {
                        console.error('Session error:', sessionError);
                        throw new Error('세션 설정 실패');
                    }
                } else if (code) {
                    // code 파라미터가 있는 경우 토큰으로 교환
                    const { data: sessionData, error: sessionError } = await supabase.auth.exchangeCodeForSession(code);
                    
                    if (sessionError) {
                        console.error('Code exchange error:', sessionError);
                        throw new Error('인증 코드 교환 실패');
                    }
                    
                    console.log('Session established via code exchange:', sessionData);
                } else {
                    throw new Error('인증 정보가 없습니다.');
                }
                
                // 비밀번호 업데이트
                const { data, error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    console.error('Password update error:', error);
                    throw new Error(error.message || '비밀번호 업데이트 실패');
                }
                
                hideLoading();
                showStatus('비밀번호가 성공적으로 재설정되었습니다! Liberaflow 앱에서 새 비밀번호로 로그인해주세요.');
                
                // 폼 숨기기
                document.getElementById('resetPasswordForm').style.display = 'none';
                
                // 5초 후 자동으로 창 닫기
                setTimeout(() => {
                    closeWindow();
                }, 5000);
                
            } catch (error) {
                hideLoading();
                showStatus(`비밀번호 재설정 중 오류가 발생했습니다: ${error.message}`, true);
                console.error('Reset password error:', error);
            }
        });
        
        // 페이지 로드 시 토큰 확인
        window.addEventListener('load', () => {
            if (!access_token && !code) {
                showStatus('유효하지 않은 재설정 링크입니다.', true);
                document.getElementById('resetPasswordForm').style.display = 'none';
            } else {
                showStatus('새로운 비밀번호를 설정해주세요.');
            }
        });
    </script>
</body>
</html>
