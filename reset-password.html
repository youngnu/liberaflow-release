<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src https://ezfarkofsfjqgnsyignt.supabase.co; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <title>비밀번호 재설정 - Liberaflow</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
      line-height:1.6;color:#1d1d1f;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .container{max-width:800px;width:100%;margin:0 auto;padding:60px 40px;text-align:center}
    .logo{font-size:2.5rem;font-weight:700;color:#1d1d1f;margin-bottom:8px;letter-spacing:-.02em}
    .reset-container{background:#f5f5f7;padding:60px;border-radius:12px;margin:30px auto;border:1px solid #e5e5e7;max-width:600px}
    .reset-icon{font-size:4rem;margin-bottom:24px;color:#0071e3}
    .reset-title{font-size:2rem;font-weight:600;color:#1d1d1f;margin-bottom:16px;letter-spacing:-.02em}
    .reset-message{font-size:1.1rem;color:#656568;margin-bottom:32px;line-height:1.5}
    .form-group{margin-bottom:24px;text-align:left}
    .form-label{display:block;font-weight:500;color:#1d1d1f;margin-bottom:8px;font-size:.95rem}
    .form-input{width:100%;padding:12px 16px;border:1px solid #d2d2d7;border-radius:8px;font-size:16px;background:#fff;transition:border-color .2s}
    .form-input:focus{outline:none;border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
    .actions{display:flex;gap:16px;flex-direction:row;align-items:center;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 32px;border-radius:8px;
      font-weight:500;font-size:1rem;border:none;cursor:pointer;transition:.2s;min-width:200px}
    .btn-primary{background:#0071e3;color:#fff}
    .btn-primary:hover:not(:disabled){background:#0068d1;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,113,227,.3)}
    .btn-primary:disabled{background:#d2d2d7;cursor:not-allowed}
    .btn-secondary{background:#f5f5f7;color:#1d1d1f;border:1px solid #e5e5e7}
    .btn-secondary:hover{background:#e5e5e7}
    .status{margin-top:24px;padding:16px;border-radius:8px;font-size:.9rem;display:none}
    .status.noscript-status{display:block}
    .status.success{background:#f0f5ff;color:#0068d1;border:1px solid #d1e4ff}
    .status.error{background:#fff5f5;color:#d70015;border:1px solid #ffd1d1}
    .loading{display:inline-block;width:16px;height:16px;border:2px solid #f3f3f3;border-top:2px solid #0071e3;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.loading{animation:none}.form-input,.btn{transition:none}}
    .footer{margin-top:40px;font-size:.85rem;color:#656568}
    @media (max-width:768px){.container{padding:40px 20px}.reset-container{padding:40px 24px;margin:20px 0}.logo{font-size:2rem}.reset-title{font-size:1.75rem}.actions{flex-direction:column}.btn{min-width:100%}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous" defer></script>
  <script src="assets/js/reset-password.js" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="logo">Liberaflow</h1>
    <div class="reset-container">
      <div class="reset-icon">🔐</div>
      <h2 class="reset-title">비밀번호 재설정</h2>
      <p class="reset-message">새로운 비밀번호를 입력해주세요.</p>

      <form id="resetPasswordForm" hidden>
        <div class="form-group">
          <label for="newPassword" class="form-label">새 비밀번호</label>
          <input type="password" id="newPassword" class="form-input" placeholder="새 비밀번호를 입력하세요" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">비밀번호 확인</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="비밀번호를 다시 입력하세요" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="resetBtn">비밀번호 재설정</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">취소</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <noscript><div class="status error noscript-status">비밀번호 재설정 링크를 처리하려면 JavaScript가 필요합니다.</div></noscript>
    </div>
    <div class="footer">비밀번호는 8자 이상이어야 합니다.</div>
  </div>

</body>
</html>
