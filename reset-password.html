<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>비밀번호 재설정 - Liberaflow</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
      line-height:1.6;color:#1d1d1f;background:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .container{max-width:800px;width:100%;margin:0 auto;padding:60px 40px;text-align:center}
    .logo{font-size:2.5rem;font-weight:700;color:#1d1d1f;margin-bottom:8px;letter-spacing:-.02em}
    .reset-container{background:#f5f5f7;padding:60px;border-radius:12px;margin:30px auto;border:1px solid #e5e5e7;max-width:600px}
    .reset-icon{font-size:4rem;margin-bottom:24px;color:#0071e3}
    .reset-title{font-size:2rem;font-weight:600;color:#1d1d1f;margin-bottom:16px;letter-spacing:-.02em}
    .reset-message{font-size:1.1rem;color:#86868b;margin-bottom:32px;line-height:1.5}
    .form-group{margin-bottom:24px;text-align:left}
    .form-label{display:block;font-weight:500;color:#1d1d1f;margin-bottom:8px;font-size:.95rem}
    .form-input{width:100%;padding:12px 16px;border:1px solid #d2d2d7;border-radius:8px;font-size:16px;background:#fff;transition:border-color .2s}
    .form-input:focus{outline:none;border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
    .actions{display:flex;gap:16px;flex-direction:row;align-items:center;justify-content:center}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:16px 32px;border-radius:8px;
      font-weight:500;font-size:1rem;border:none;cursor:pointer;transition:.2s;min-width:200px}
    .btn-primary{background:#0071e3;color:#fff}
    .btn-primary:hover:not(:disabled){background:#0077ed;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,113,227,.3)}
    .btn-primary:disabled{background:#d2d2d7;cursor:not-allowed}
    .btn-secondary{background:#f5f5f7;color:#1d1d1f;border:1px solid #e5e5e7}
    .btn-secondary:hover{background:#e5e5e7}
    .status{margin-top:24px;padding:16px;border-radius:8px;font-size:.9rem;display:none}
    .status.success{background:#f0f5ff;color:#0071e3;border:1px solid #d1e4ff}
    .status.error{background:#fff5f5;color:#d70015;border:1px solid #ffd1d1}
    .loading{display:inline-block;width:16px;height:16px;border:2px solid #f3f3f3;border-top:2px solid #0071e3;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    .footer{margin-top:40px;font-size:.85rem;color:#86868b}
    @media (max-width:768px){.container{padding:40px 20px}.reset-container{padding:40px 24px;margin:20px 0}.logo{font-size:2rem}.reset-title{font-size:1.75rem}.actions{flex-direction:column}.btn{min-width:100%}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1 class="logo">Liberaflow</h1>
    <div class="reset-container">
      <div class="reset-icon">🔐</div>
      <h2 class="reset-title">비밀번호 재설정</h2>
      <p class="reset-message">새로운 비밀번호를 입력해주세요.</p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword" class="form-label">새 비밀번호</label>
          <input type="password" id="newPassword" class="form-input" placeholder="새 비밀번호를 입력하세요" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword" class="form-label">비밀번호 확인</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="비밀번호를 다시 입력하세요" minlength="8" required />
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="resetBtn">비밀번호 재설정</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">취소</button>
        </div>
      </form>

      <div id="status" class="status"></div>
    </div>
    <div class="footer">비밀번호는 8자 이상이어야 합니다.</div>
  </div>

  <script>
    // ===== ① Supabase 클라이언트 =====
    const SUPABASE_URL = 'https://ezfarkofsfjqgnsyignt.supabase.co'; // ← 교체
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6ZmFya29mc2ZqcWduc3lpZ250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjA4MzQyMTMsImV4cCI6MjAzNjQxMDIxM30.UJkG0DaRD6OHpzJKdZYLXhips3W9E83G8Vsc1_HCDps';                   // ← 교체
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        detectSessionInUrl: true, // 해시 토큰(#access_token) 자동 감지
        // flowType 옵션은 여기서 지정하지 않아도 아래 분기들이 동작함
      },
    });

    // ===== ② UI 유틸 =====
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    function showStatus(msg, isError=false){
      statusEl.className = `status ${isError ? 'error' : 'success'}`;
      statusEl.textContent = msg;
      statusEl.style.display = 'block';
    }
    function showLoading(){ resetBtn.innerHTML = `<div class="loading"></div>재설정 중...`; resetBtn.disabled = true; }
    function hideLoading(){ resetBtn.innerHTML = '비밀번호 재설정'; resetBtn.disabled = false; }

    // ===== ③ 세션 확보 로직 (token_hash ▶ code ▶ #access_token 순서) =====
    async function ensureSession() {
      // 이미 세션 있으면 반환
      let { data: { session } } = await supabase.auth.getSession();
      if (session) return session;

      const qs = new URLSearchParams(window.location.search);
      const hs = new URLSearchParams(window.location.hash.replace(/^#/, ''));

      // 3-1) verifyOtp(recovery) — 템플릿에서 token_hash를 넘기는 경우
      const token_hash = qs.get('token_hash');
      const type = (qs.get('type') || '').toLowerCase();
      if (token_hash && (type === 'recovery' || type === 'email')) {
        const { data, error } = await supabase.auth.verifyOtp({ type: 'recovery', token_hash });
        if (error) throw error;
        ({ data: { session } } = await supabase.auth.getSession());
        if (session) return session;
      }

      // 3-2) PKCE code 교환 — 같은 브라우저에서 흐름을 시작한 경우만 성공
      const code = qs.get('code');
      if (code) {
        const { data, error } = await supabase.auth.exchangeCodeForSession(code);
        if (error) {
          // PKCE 제약: code_verifier가 없거나 만료되면 실패
          throw new Error(error.message || '코드 교환 실패');
        }
        ({ data: { session } } = await supabase.auth.getSession());
        if (session) return session;
      }

      // 3-3) Implicit 해시 토큰 직접 세팅
      const access_token = hs.get('access_token');
      const refresh_token = hs.get('refresh_token');
      if (access_token && refresh_token) {
        const { data, error } = await supabase.auth.setSession({ access_token, refresh_token });
        if (error) throw error;
        ({ data: { session } } = await supabase.auth.getSession());
        if (session) return session;
      }

      throw new Error('유효한 인증 정보를 찾을 수 없습니다. 이메일 링크를 다시 요청해 주세요.');
    }

    // ===== ④ 비밀번호 업데이트 =====
    async function doResetPassword(newPassword) {
      await ensureSession(); // 세션 확보 후
      const { data, error } = await supabase.auth.updateUser({ password: newPassword });
      if (error) throw error; // 실패 시 에러 전달
      return data;
    }

    // ===== ⑤ 폼 핸들러 =====
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const pw1 = document.getElementById('newPassword').value.trim();
      const pw2 = document.getElementById('confirmPassword').value.trim();

      if (pw1 !== pw2) return showStatus('비밀번호가 일치하지 않습니다.', true);
      if (pw1.length < 8) return showStatus('비밀번호는 8자 이상이어야 합니다.', true);

      showLoading();
      try{
        await doResetPassword(pw1);
        hideLoading();
        showStatus('비밀번호가 성공적으로 재설정되었습니다! Liberaflow 앱에서 새 비밀번호로 로그인해주세요.');
        document.getElementById('resetPasswordForm').style.display = 'none';
        setTimeout(()=>{ try{ window.close(); } catch{} }, 5000);
      }catch(err){
        hideLoading();
        showStatus(`비밀번호 재설정 중 오류가 발생했습니다: ${err.message}`, true);
        console.error(err);
      }
    });

    // ===== ⑥ 취소 버튼 =====
    document.getElementById('cancelBtn').addEventListener('click', ()=>{
      try { window.close(); } catch { showStatus('이 창을 수동으로 닫아주세요.', true); }
    });

    // ===== ⑦ 초기 메시지 =====
    window.addEventListener('load', ()=>{
      showStatus('새로운 비밀번호를 설정해주세요.');
    });

    // (디버그) 상태 변화 로그
    supabase.auth.onAuthStateChange((evt, sess)=>console.log('[auth event]', evt, !!sess));
  </script>
</body>
</html>
